server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: AlgoCrack-ProblemService
    
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:0}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        
  flyway:
    enabled: true
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:10}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.hrishabh.problemservice: INFO

# Problem of the Day scheduler (UTC). Job is off unless explicitly enabled.
potd:
  scheduler:
    enabled: false
    zone-id: UTC
    cron: "0 0 15 * * ?"
    draft-horizon-days: 45
    published-low-water-days: 14
    published-warn-days: 21
    exact-cooldown-days: 14
    emergency-min-cooldown-days: 3
    family-cooldown-days: 30
    scheduler-version: potd-planner-v1

# Cross-service API URLs
services:
  auth:
    base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:7483}
  submission:
    base-url: ${SUBMISSION_SERVICE_URL:http://submission-service:8080}

# Complexity benchmark profiles (Phase 3 — internal only, default off)
complexity:
  profile-api-enabled: ${COMPLEXITY_PROFILE_API_ENABLED:false}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  internal-auth-require-token: ${COMPLEXITY_INTERNAL_AUTH_REQUIRE_TOKEN:false}
