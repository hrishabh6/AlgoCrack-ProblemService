server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: AlgoCrack-ProblemService
    
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      initialization-fail-timeout: ${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:0}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  flyway:
    enabled: true
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:10}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.hrishabh.problemservice: DEBUG

# Cross-service API URLs
services:
  auth:
    base-url: ${AUTH_SERVICE_BASE_URL:http://auth-service:7483}
  submission:
    base-url: ${SUBMISSION_SERVICE_URL:http://submission-service:8080}
