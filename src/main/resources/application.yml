server:
  port: 8084

spring:
  application:
    name: AlgoCrack-ProblemService
    
  datasource:
    url: jdbc:mysql://localhost:3306/leetcode
    username: ${DB_USERNAME:root}
    password: hrishabh@123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  flyway:
    enabled: false

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    com.hrishabh.problemservice: DEBUG

# Cross-service API URLs
services:
  auth:
    base-url: http://localhost:8085
  submission:
    base-url: http://localhost:8082
